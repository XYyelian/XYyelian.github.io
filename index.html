  { url: "https://lithtml.com/Update/CRAIV-110Y/", update: "update.json", name: "Craiv110Y-安卓板", product: "一体机", log:"修改记录_CRAIV-110Y_android.txt", rawUrl:"http://dl.cii-tech.com/Update/CRAIV-110Y/update.json", image: "src/Craiv-110Y.png" },
  { url: "https://lithtml.com/Update/CRA-110/", update: "update.json", name: "掌上扫毒", product: "掌上扫毒", log:"修改记录_CRA-110_android.txt", rawUrl:"http://dl.cii-tech.com/Update/CRA-110/update.json", image: "src/CRA-110.png" },
  { url: "https://lithtml.com/Update/HIA-100/", update: "update.json", name: "手持荧光", product: "手持荧光", log:"修改记录.txt", rawUrl:"http://dl.cii-tech.com/Update/HIA-100/update.json", image: "src/HIA-100.png"}
];

const resultsContainer = document.getElementById("results");
const moduleFiltersContainer = document.getElementById("moduleFilters");
const refreshBtn = document.getElementById("refreshBtn");
const selectAllBtn = document.getElementById("selectAll");
const selectNoneBtn = document.getElementById("selectNone");
const logModal = document.getElementById("logModal");
const modalTitle = document.getElementById("modalTitle");
const logContent = document.getElementById("logContent");
const closeBtn = document.querySelector(".close");

const uploadBtn = document.getElementById("uploadBtn");
const uploadPage = document.getElementById("uploadPage");
const mainPage = document.getElementById("mainPage");
const backToMainBtn = document.getElementById("backToMainBtn");
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileInfo = document.getElementById("fileInfo");
const fileName = document.getElementById("fileName");
const fileSize = document.getElementById("fileSize");
const fileSHA1 = document.getElementById("fileSHA1");
const fileMD5 = document.getElementById("fileMD5");
const uploadBtnActual = document.getElementById("uploadBtnActual");
const progressBar = document.getElementById("progressBar");
const progressFill = document.getElementById("progressFill");
const statusMessage = document.getElementById("statusMessage");
const jsonPreview = document.getElementById("jsonPreview");

const results = {}; // 用于存储所有获取到的数据

// 存储拖拽或选择的文件
let currentFile = null;

// 从本地存储加载勾选状态
let selectedModules = loadSelectedModules();

// 生成模块筛选复选框（按产品分组）
function renderModuleFilters() {
  moduleFiltersContainer.innerHTML = '';
  
  // 按产品分组
  const groupedModules = {};
  urlMap.forEach(item => {
    if (!groupedModules[item.product]) {
      groupedModules[item.product] = [];
    }
    groupedModules[item.product].push(item);
  });
  
  // 为每个产品创建一个复选框组
  Object.entries(groupedModules).forEach(([productName, modules]) => {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'checkbox-group';
    groupDiv.innerHTML = `<div class="checkbox-group-title">${productName}</div>`;
    
    modules.forEach(module => {
      const checkboxId = `module-${module.url.replace(/[^a-zA-Z0-9]/g, '-')}`;
      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox-item';
      checkbox.innerHTML = `
        <input type="checkbox" id="${checkboxId}" value="${module.url}${module.update}" ${selectedModules.includes(module.url + module.update) ? 'checked' : ''}>
        <label for="${checkboxId}">${module.name}</label>
      `;
      groupDiv.appendChild(checkbox);
    });
    
    moduleFiltersContainer.appendChild(groupDiv);
  });
  
  // 添加事件监听
  document.querySelectorAll('#moduleFilters input[type="checkbox"]').forEach(checkbox => {
    checkbox.addEventListener('change', saveSelectedModules);
  });
}

// 保存勾选状态到本地存储
function saveSelectedModules() {
  const checkboxes = document.querySelectorAll('#moduleFilters input[type="checkbox"]:checked');
  selectedModules = Array.from(checkboxes).map(cb => cb.value);
  localStorage.setItem('selectedModules', JSON.stringify(selectedModules));
}

// 从本地存储加载勾选状态
function loadSelectedModules() {
  const saved = localStorage.getItem('selectedModules');
  if (saved) {
    return JSON.parse(saved);
  }
  // 默认全选（所有URL）
  return urlMap.map(item => item.url + item.update);
}

// 获取选中的模块
function getSelectedModules() {
  return selectedModules;
}

// 构建下载URL
function buildDownloadUrl(basePath, fileName) {
  // 获取基础URL（去掉文件名部分）
  const baseUrl = basePath;
  return baseUrl + fileName;
}

// 下载文件函数
function downloadFile(url, filename) {
  // 如果是同源，可以直接用 a[download]
  if (new URL(url).origin === window.location.origin) {
    const link = document.createElement('a');
    link.href = url;
    link.download = filename || url.substring(url.lastIndexOf('/') + 1);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    return;
  }

  // 跨域情况：必须通过 fetch + Blob 方式
  fetch(url)
    .then(response => {
      if (!response.ok) {
        throw new Error(`下载失败: ${response.status} ${response.statusText}`);
      }
      return response.blob();
    })
    .then(blob => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename || url.substring(url.lastIndexOf('/') + 1);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href); // 释放内存
    })
    .catch(err => {
      alert(`下载失败：${err.message}\n\nURL: ${url}`);
      console.error('Download error:', err);
    });
}

// 点击历史版本下载文件
function downloadHistoryVersion(basePath, version) {
  const downloadUrl = buildDownloadUrl(basePath, version);
  downloadFile(downloadUrl, version);
}

// 显示更新日志对话框
function showUpdateLog(basePath, logFile, moduleName) {
  modalTitle.textContent = `更新日志 - ${moduleName}`;
  logContent.textContent = "加载中...";
  logModal.style.display = "block";

  const logUrl = buildDownloadUrl(basePath, logFile);

  fetch(logUrl)
    .then(response => {
      if (!response.ok) {
        throw new Error(`服务器错误: ${response.status}`);
      }
      return response.arrayBuffer(); // 获取原始二进制数据
    })
    .then(arrayBuffer => {
      // 使用 TextDecoder 指定编码为 'gbk'（兼容 GB2312）
      const decoder = new TextDecoder('gbk', { fatal: false });
      const text = decoder.decode(arrayBuffer);
      logContent.textContent = text;
    })
    .catch(error => {
      logContent.textContent = `加载更新日志失败: ${error.message}`;
    });
}

async function loadAllVersions() {
  // 禁用按钮
  refreshBtn.disabled = true;
  refreshBtn.textContent = "加载中...";

  const productData = {};
  const selectedUrls = getSelectedModules();
  
  // 先按产品分组
  for (const item of urlMap) {
    const fullUrl = item.url + item.update;
    if (!selectedUrls.includes(fullUrl)) {
      continue; // 跳过未选中的模块
    }
    if (!productData[item.product]) {
      productData[item.product] = [];
    }
    productData[item.product].push(item);
  }

  // 清空结果容器
  resultsContainer.innerHTML = "";

  try {
    // 为每个有选中模块的产品创建卡片
    for (const [productName, items] of Object.entries(productData)) {
      if (items.length === 0) continue; // 跳过没有选中模块的产品
      
      const productCard = document.createElement("div");
      productCard.className = "product-card";
      productCard.innerHTML = `<h2>${productName}</h2>`;
      
      const modulesContainer = document.createElement("div");
      
      // 为每个选中的模块加载数据
      for (const item of items) {
        const fullUrl = item.url + item.update;
        try {
          const response = await fetch(fullUrl);
          if (!response.ok) {
            throw new Error(`服务器错误: ${response.status}`);
          }
          const data = await response.json();
          
          // 保存数据到全局对象
          results[fullUrl] = data;
          
          modulesContainer.appendChild(createModuleCard(data, item.url, item.name, item.log, item.rawUrl, item.image));
        } catch (err) {
          modulesContainer.appendChild(createErrorModuleCard(fullUrl, item.name, err.message));
        }
      }
      
      productCard.appendChild(modulesContainer);
      resultsContainer.appendChild(productCard);
    }
  } finally {
    // 启用按钮
    refreshBtn.disabled = false;
    refreshBtn.textContent = "🔄 获取数据";
  }
}

function createModuleCard(data, baseUrl, name, logFile, rawUrl, image) {
  const moduleCard = document.createElement("div");
  moduleCard.className = "module-card";

  // 构建最新版本下载URL
  const latestDownloadUrl = data.latest ? buildDownloadUrl(baseUrl, data.latest) : null;
  
  // 构建历史版本列表
  let historyList = "";
  if (data.history && Array.isArray(data.history) && data.history.length > 0) {
    historyList = `<details><summary>历史版本 (${data.history.length})</summary><div class="history">`;
    data.history.forEach(version => {
      historyList += `
        <div class="history-item" onclick="downloadHistoryVersion('${baseUrl}', '${version}')" title="点击下载 ${version}">
          ${version}
        </div>
      `;
    });
    historyList += `</div></details>`;
  }

  moduleCard.innerHTML = `
    <div class="module-header">
      <img src="${image}" alt="${name}" class="module-image" onerror="this.style.display='none';">
      <h3 class="module-title">${name}</h3>
    </div>
    <div class="info">
      <div class="info-item-version">
        <span class="label">软体版本:</span>
        <span class="value">${data.softVersion || '-'}</span>
      </div>
      <div class="info-item">
        <span class="label">发布者:</span>
        <span class="value">${data.publisher || '-'}</span>
      </div>
      <div class="info-item">
        <span class="label">发布日期:</span>
        <span class="value">${data.releaseDate || '-'}</span>
      </div>
      <div class="info-item">
        <span class="label">版本号:</span>
        <span class="value">${data.releaseVersion || '-'}</span>
      </div>
	  <div class="info-item">
		<span class="label">最新版:</span>
        <button class="download-btn" onclick="downloadFile('${latestDownloadUrl}', '${data.latest}')"  title="点击下载最新版">下载</button>
      </div>
	  <div class="info-item">
		<span class="label">更新日志:</span>
        <button class="view-log-btn" onclick="showUpdateLog('${baseUrl}', '${logFile}', '${name}')"  title="点击查看更新日志">查看</button>
		<button class="download-btn" style="margin-left:6px;" onclick="downloadFile('${buildDownloadUrl(baseUrl, logFile)}', '${logFile}')" title="下载更新日志">下载</button>
      </div>
    </div>
    ${historyList}
    <div class="url-info">
      <span class="label">数据源:</span> <code>${rawUrl}</code>
    </div>
  `;
  return moduleCard;
}

function createErrorModuleCard(url, name, errorMsg) {
  const moduleCard = document.createElement("div");
  moduleCard.className = "module-card error-module";
  moduleCard.innerHTML = `
    <div class="module-header">
      <img src="${image || 'src/default.png'}" alt="${name}" class="module-image" onerror="this.style.display='none';">
      <h3 class="module-title" style="color:#e74c3c;">❌ ${name}</h3>
    </div>
    <div class="error"><strong>错误信息:</strong> ${errorMsg}</div>
    <div class="url-info">
      <span class="label">URL地址:</span> <code>${url}</code>
    </div>
  `;
  return moduleCard;
}

// SHA1 和 MD5 计算函数（简化版，实际应用中可能需要更复杂的算法）
function computeSHA1(buffer) {
  // 在实际应用中，这里应该使用 Web Crypto API 或其他库来计算 SHA1
  // 这里只是模拟返回一个固定的值
  return '88F85E43A86D35E8D53F5076E78B0AF979C6492D';
}

function computeMD5(buffer) {
  // 在实际应用中，这里应该使用 Web Crypto API 或其他库来计算 MD5
  // 这里只是模拟返回一个固定的值
  return '945C870E3E7BF8E3685F021D2DDA5C9D';
}

function formatFileSize(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024;
  const sizes = ['Bytes', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

function formatDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}年${month}月${day}日`;
}

function generateJSON(fileInfo) {
  const today = new Date();
  return {
    "project": fileInfo.project || "SAFS-110B",
    "latest": `http://120.26.34.100/download/${fileInfo.name}`,
    "softVersion": "",
    "releaseVersion": 23,
    "publisher": "yozad.von",
    "releaseDate": formatDate(today),
    "changeLog": "",
    "SHA1": fileInfo.sha1,
    "MD5": fileInfo.md5,
    "history": []
  };
}

// 文件处理
function handleFileSelect(files) {
  if (files.length === 0) return;
  
  const file = files[0];
  currentFile = file; // 保存当前文件
  
  // 显示文件信息
  fileName.textContent = file.name;
  fileSize.textContent = formatFileSize(file.size);
  
  // 显示文件信息区域
  fileInfo.style.display = 'block';
  
  // 计算 SHA1 和 MD5
  const reader = new FileReader();
  reader.onload = function(e) {
    const buffer = e.target.result;
    
    // 模拟计算 SHA1 和 MD5（实际应用中应使用 Web Crypto API）
    fileSHA1.textContent = computeSHA1(buffer);
    fileMD5.textContent = computeMD5(buffer);
    
    // 生成 JSON 预览
    const fileInfoObj = {
      name: file.name,
      size: file.size,
      sha1: computeSHA1(buffer),
      md5: computeMD5(buffer),
      project: "SAFS-110B"
    };
    
    const json = generateJSON(fileInfoObj);
    jsonPreview.textContent = JSON.stringify(json, null, 2);
    jsonPreview.style.display = 'block';
    
    // 显示上传按钮
    uploadBtnActual.style.display = 'block';
  };
  
  reader.readAsArrayBuffer(file);
}

// 上传文件
async function uploadFile() {
  // 检查是否有文件被选择或拖拽
  if (!currentFile) {
    showMessage('请选择一个文件', 'error');
    return;
  }
  
  const file = currentFile;
  
  const formData = new FormData();
  formData.append('file', file);
  
  // 显示进度条
  progressBar.style.display = 'block';
  progressFill.style.width = '0%';
  
  try {
    // 模拟上传进度
    for (let i = 0; i <= 100; i += 10) {
      progressFill.style.width = i + '%';
      await new Promise(resolve => setTimeout(resolve, 100)); // 模拟上传延迟
    }
    
    // 实际上传请求（这里需要根据实际后端接口调整）
    const response = await fetch('/download', {
      method: 'POST',
      body: formData
    });
    
    if (response.ok) {
      showMessage('文件上传成功！', 'success');
      
      // 生成 JSON 文件并提示下载
      const fileInfoObj = {
        name: file.name,
        size: file.size,
        sha1: fileSHA1.textContent,
        md5: fileMD5.textContent,
        project: "SAFS-110B"
      };
      
      const json = generateJSON(fileInfoObj);
      const jsonBlob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
      const jsonUrl = URL.createObjectURL(jsonBlob);
      
      const link = document.createElement('a');
      link.href = jsonUrl;
      link.download = 'update.json';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(jsonUrl);
      
      // 提示用户 JSON 已生成
      setTimeout(() => {
        showMessage('JSON 配置文件已生成并下载！', 'success');
      }, 500);
    } else {
      throw new Error(`上传失败: ${response.status} ${response.statusText}`);
    }
  } catch (error) {
    showMessage(`上传失败: ${error.message}`, 'error');
  } finally {
    // 隐藏进度条
    progressBar.style.display = 'none';
  }
}

function showMessage(message, type) {
  statusMessage.textContent = message;
  statusMessage.className = `status-message status-${type}`;
  statusMessage.style.display = 'block';
  
  // 3秒后隐藏消息
  //setTimeout(() => {

  //}, 3000);
}
